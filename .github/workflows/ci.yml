name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json (pnpm/action-setup fails if both are set and differ).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check contract drift
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "Generated types no longer match upnext-openapi.yaml. Run pnpm gen:api and commit." && exit 1)

      - name: Build
        run: pnpm build
